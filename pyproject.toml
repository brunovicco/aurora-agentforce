[project]
name = "aurora-agentforce"
version = "0.1.0"
description = "Synthetic orders API for a Salesforce Agentforce after-sales case study"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "defusedxml>=0.7.1",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "mypy>=1.16",
    "openapi-spec-validator>=0.7,<1",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_orders"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "D", "S"]
ignore = ["ANN401", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "ANN"]
"scripts/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
show_error_codes = true
mypy_path = "src,stubs"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/aurora_orders --cov=scripts.portal_prepare --cov=scripts.portal_customer_inventory --cov=scripts.portal_permission_review --cov=scripts.portal_grant_inventory --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/aurora_orders", "scripts.portal_prepare", "scripts.portal_customer_inventory", "scripts.portal_permission_review", "scripts.portal_grant_inventory"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.engineering-harness.quality]
source-roots = ["src"]
security-roots = ["src", "scripts/portal_*.py"]
test-roots = ["tests"]

[tool.engineering-harness.architecture]
source-roots = ["src"]
clean-architecture = true
