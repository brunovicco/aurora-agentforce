name: Salesforce DX metadata checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-static:
    name: metadata-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Validate portal metadata
        run: uv run python scripts/portal_prepare.py
      - name: Check Salesforce project and XML metadata
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from defusedxml import ElementTree as ET
          from pathlib import Path

          project = json.loads(Path('salesforce/sfdx-project.json').read_text())
          assert project['sourceApiVersion'] == '68.0'
          assert project['packageDirectories'][0]['path'] == 'force-app'
          metadata_suffixes = {
              '.xml',
              '.messagingchannel',
              '.queue',
              '.queueroutingconfig',
              '.permissionset',
          }
          xml_files = sorted(
              path for path in Path('salesforce').rglob('*')
              if path.is_file()
              and path.suffix.lower() in metadata_suffixes
          )
          assert xml_files, 'No Salesforce metadata files found'
          for item in xml_files:
              ET.parse(item, forbid_dtd=True, forbid_entities=True, forbid_external=True)
          print(f'Validated Salesforce DX project and {len(xml_files)} XML files.')
          PY

      - name: Validate Shell syntax
        shell: bash
        run: |
          for file in scripts/sf-*.sh; do
            bash -n "$file"
          done

      - name: Validate evaluation scenario manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cases = json.loads(Path('evals/scenarios.json').read_text())['cases']
          assert len(cases) == 12, 'Expected exactly 12 evaluation scenarios'
          assert len({case['id'] for case in cases}) == len(cases)
          assert all(case['utterance'] and case['acceptance'] for case in cases)
          print(f'Validated {len(cases)} evaluation scenarios (not a runtime pass).')
          PY

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## Salesforce DX static checks'
            echo ''
            echo 'Validated source metadata, shell syntax, and evaluation scenario structure.'
            echo 'This job does not deploy to Salesforce or execute Agentforce actions.'
          } >> "$GITHUB_STEP_SUMMARY"
