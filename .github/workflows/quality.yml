name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Project quality gate
        id: quality
        run: uv run python scripts/quality_gate.py

      - name: Verify Salesforce approval guard in source metadata
        run: uv run python scripts/verify_aurora_flow.py

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Aurora quality gate'
            echo ''
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Quality gate: \`${{ steps.quality.outcome }}\`"
            echo ''
            echo 'Checks: uv lockfile, Ruff lint/format, architecture, Mypy, pytest + coverage, Bandit, dependency audit, and approval-guard Flow verification.'
            echo ''
            echo 'This offline workflow never logs into a Salesforce org or invokes live agent actions.'
          } >> "$GITHUB_STEP_SUMMARY"
